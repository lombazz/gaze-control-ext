<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gaze Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #333;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    .status.active { background: #34a853; }
    .status.error { background: #ea4335; }

    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      transition: 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #4285f4; }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    /* Radio buttons */
    .radio-group {
      display: flex;
      gap: 8px;
    }
    .radio-option {
      flex: 1;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
    }
    .radio-option:hover { border-color: #bbb; }
    .radio-option.selected {
      border-color: #4285f4;
      background: #e8f0fe;
    }
    .radio-option .icon { font-size: 20px; display: block; margin-bottom: 4px; }

    /* Sliders */
    .slider-row {
      margin-bottom: 12px;
    }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .slider-row input[type="range"] {
      width: 100%;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary {
      background: #4285f4;
      color: white;
    }
    .btn-primary:hover { background: #3367d6; }
    .btn-secondary {
      background: #f1f3f4;
      color: #333;
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #e0e0e0; }

    .info {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>
    <span class="status" id="statusDot"></span>
    Gaze Control
  </h1>

  <div class="section">
    <div class="toggle-row">
      <span>Enable Tracking</span>
      <label class="switch">
        <input type="checkbox" id="enableToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Click Method</div>
    <div class="radio-group">
      <div class="radio-option" data-method="blink" id="optBlink">
        <span class="icon">👁️</span>
        Blink
      </div>
      <div class="radio-option" data-method="pinch" id="optPinch">
        <span class="icon">🤏</span>
        Pinch
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Sensitivity</div>
    <div class="slider-row">
      <label>
        <span>Blink Duration</span>
        <span id="blinkVal">300ms</span>
      </label>
      <input type="range" id="blinkDuration" min="150" max="600" step="50" value="300" />
    </div>
    <div class="slider-row">
      <label>
        <span>Smoothing</span>
        <span id="smoothVal">0.3</span>
      </label>
      <input type="range" id="smoothing" min="0.05" max="0.8" step="0.05" value="0.3" />
    </div>
    <div class="slider-row">
      <label>
        <span>Cursor Size</span>
        <span id="cursorVal">24px</span>
      </label>
      <input type="range" id="cursorSize" min="12" max="48" step="4" value="24" />
    </div>
  </div>

  <div class="section">
    <button class="btn btn-primary" id="calibrateBtn">Calibrate Gaze</button>
    <button class="btn btn-secondary" id="resetBtn">Reset Calibration</button>
  </div>

  <div class="info">Alt+G to toggle • v0.1.0</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
